<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bună!</title>
<style>
:root { color-scheme: light; --ink: #13304f; --ink-2: #4a607a; --sky: #e9f6ff; --line: #e3eef7; --good: #17915a;
  --sun: #ffc21a; --card: #ffffff; --accent: #2b8be6; }
* { box-sizing: border-box; }
html, body { margin: 0; background: #ffffff; color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, sans-serif; }
body { background: linear-gradient(180deg, #eaf7ff 0%, #ffffff 320px) no-repeat, #ffffff; min-height: 100vh; }
[hidden] { display: none !important; }

/* the welcome screen */
#gate { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 16px; background: radial-gradient(circle at 50% 40%, #fffbe6 0%, #ffffff 55%); z-index: 2;
  transition: opacity .6s ease .35s; }
#gate h1 { font-size: 44px; margin: 0; letter-spacing: .5px; }
#gate form { display: flex; gap: 8px; }
#gate input { font: inherit; font-size: 18px; padding: 12px 16px; border: 2px solid #ffe08a; border-radius: 999px;
  outline: none; width: min(260px, 70vw); background: #fffef7; color: var(--ink); text-align: center; }
#gate input:focus { border-color: var(--sun); box-shadow: 0 0 0 5px rgba(255, 194, 26, .2); }
#gate button { font: inherit; font-size: 20px; width: 52px; border-radius: 999px; border: 0; background: var(--sun);
  color: #5a3a00; cursor: pointer; }
#gate button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
#gate button:disabled { opacity: .6; cursor: progress; }
#reply { min-height: 1.5em; margin: 0; font-size: 20px; color: var(--ink-2); }
body.open #gate { opacity: 0; pointer-events: none; }

/* the sun: centred on the welcome screen, then tucked into the top-left corner */
#sun { width: 210px; height: 210px; z-index: 3; transition: transform .9s cubic-bezier(.6,.05,.25,1); }
#sun svg { width: 100%; height: 100%; overflow: visible; }
#sun .rays { transform-origin: 100px 100px; animation: spin 40s linear infinite; }
#sun.wiggle { animation: wiggle .5s ease; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes wiggle { 0%, 100% { rotate: 0deg; } 25% { rotate: -8deg; } 75% { rotate: 8deg; } }

/* the holdings */
main { max-width: 980px; margin: 0 auto; padding: 28px 16px 48px; opacity: 0; transition: opacity .7s ease .5s; }
body.open main { opacity: 1; }
.hero { padding: 24px 0 8px 96px; min-height: 120px; }
.hero h1 { font-size: 34px; margin: 6px 0 4px; }
.lead { margin: 0; color: var(--ink-2); font-size: 18px; }
.badge { display: inline-block; background: #e7f8ef; color: var(--good); border: 1px solid #bfeccf; border-radius: 999px;
  padding: 4px 12px; font-size: 13px; font-weight: 600; }
.summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin: 22px 0 8px; }
.tile, .holding { background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: 0 6px 24px rgba(43, 139, 230, .07); }
.tile { padding: 16px 18px; }
.label { color: var(--ink-2); font-size: 13px; }
.hero-num { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
.big { font-size: 21px; font-weight: 650; font-variant-numeric: tabular-nums; }
.small { color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
.good { color: var(--good); }
h2 { font-size: 20px; margin: 30px 0 12px; }
.holding { padding: 18px 20px; margin-bottom: 14px; }
.holding-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.holding h3 { margin: 2px 0 0; font-size: 19px; }
.kind { color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }
.pill { background: #fff6d6; color: #7a5600; border-radius: 999px; padding: 4px 12px; font-size: 13px; white-space: nowrap; }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-top: 14px; }
.asof { margin-top: 12px; color: var(--good); font-size: 13px; }
.note { color: var(--ink-2); }
footer { margin-top: 30px; color: var(--ink-2); font-size: 13px; border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 560px) { .hero { padding-left: 0; padding-top: 70px; } #gate h1 { font-size: 36px; } }
@media (prefers-reduced-motion: reduce) { #sun, #sun .rays, #gate, main { transition: none; animation: none; } }
</style></head><body>

<script>
(function () {
  var payload = JSON.parse(document.getElementById('payload').textContent);
  var bytes = function (b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); };
  async function decrypt(word) {  // same normalisation as normalize_word() in _holder_page.py
    var norm = word.trim().toLowerCase().replace(/\s+/g, ' ');
    if (!norm || !(window.crypto && crypto.subtle)) return null;
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm), 'PBKDF2', false, ['deriveKey']);
      var key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: bytes(payload.s), iterations: payload.n, hash: 'SHA-256'},
                                              base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
      return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: bytes(payload.i)}, key, bytes(payload.c)));
    } catch (e) { return null; }  // wrong word: the authentication tag does not match
  }
  var sun = document.getElementById('sun'), input = document.getElementById('word'), reply = document.getElementById('reply');
  var button = document.querySelector('#gate-form button');
  document.getElementById('gate-form').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    button.disabled = true; reply.textContent = '…';
    var html = await decrypt(input.value);
    button.disabled = false;
    if (html === null) {
      reply.textContent = 'Si ce altceva';
      sun.classList.remove('wiggle'); void sun.offsetWidth; sun.classList.add('wiggle');
      input.select();
      return;
    }
    reply.textContent = '';
    document.getElementById('content').innerHTML = html;
    // move the sun from where it is to the top-left corner, small, and keep it there
    var r = sun.getBoundingClientRect(), size = 84, margin = 14, scale = size / r.width;
    sun.style.position = 'fixed'; sun.style.left = r.left + 'px'; sun.style.top = r.top + 'px'; sun.style.margin = '0';
    document.body.appendChild(sun);
    requestAnimationFrame(function () {
      sun.style.transformOrigin = '0 0';
      sun.style.transform = 'translate(' + (margin - r.left) + 'px,' + (margin - r.top) + 'px) scale(' + scale + ')';
    });
    document.body.classList.add('open');
    document.title = 'Bunurile tale';
  });
})();
</script>
